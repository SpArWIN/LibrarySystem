
x-registry: &registry
  image: ${REGISTRY:-systemlibrary}/${SERVICE_NAME}:${TAG:-latest}
  
services:
  redis:
    <<: *registry
    image: redis:7.4-alpine
    container_name: ${SERVICE_NAME:-systemlibrary}_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - library_network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  minio:
    <<: *registry
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    profiles:
      - "library"
      - "dev"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: [ "server","/data","--console-address",":${MINIO_CONSOLE_PORT}" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - library_network
    restart: unless-stopped
    
  postgres:
    <<: *registry
    image: postgres:13.20-alpine
    container_name: library_postgres
    profiles:
      - "library"
      - "dev"
    environment:
      POSTGRES_DB: central_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - library_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d central_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  nats:
    <<: *registry
    image: nats:2-alpine
    container_name: library_nats
    command: [ "-js", "-sd", "/data" ]
    ports:
      - "4222:4222"   
      - "8222:8222"  
      - "6222:6222"  
    volumes:
      - nats_data:/data
    networks:
      - library_network
    restart: unless-stopped
    environment:
      - NATS_JS_DOMAIN=library 
      - NATS_HTTP_PORT=8222
  
networks:
  library_network:
    driver: bridge

volumes:
  postgres_data:
  minio-data:
  nats_data:
  redis_data:
    driver: local